
<ion-content>
  <div class="header">
    <ion-img id="imagen2" src="assets/icon/no-words-gb.png"></ion-img>
    <span class="title">Mi Carrito 🛒</span>
  </div>
  <div *ngIf="carrito.length === 0" class="empty-cart">
    <img src="https://cdn-icons-png.flaticon.com/512/2038/2038854.png" alt="Carrito vacío" class="empty-img" />
    <div class="empty-text">Tu carrito está vacío</div>
  </div>
  <div *ngIf="carrito.length > 0" class="cart-list"> <!-- visto en clase y yt-->
    <div class="cart-item" *ngFor="let item of carrito">
      <img [src]="item.imagen" [alt]="item.nombre" class="item-img" />
      <div class="item-info">
        <div class="item-nombre">{{ item.nombre }}</div>
        <div class="item-precio">${{ item.precio_usd }} USD</div>
        <div class="item-cantidad">
          Cantidad:
          <input type="number" min="1" [value]="item.cantidad" (change)="cambiarCantidad(item, $event.target.valueAsNumber)" style="width: 48px; margin-left: 4px;" />
        </div>
      </div>
      <button ion-button class="remove-btn" (click)="eliminarDelCarrito(item)">
        <ion-icon src="assets/icon/close-circle-outline.svg" z-index= 5></ion-icon>
      </button> <!-- botón para eliminar, revisar el icono para q se vea -->
    </div>
    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal</span>
        <span>${{ subtotalUSD }} USD</span>
      </div>
      <div class="summary-row">
        <span>Envío</span>
        <span>${{ envioUSD }} USD</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>${{ totalUSD }} USD</span>
      </div>
      <button ion-button class="checkout-btn" (click)="router.navigate(['/pago'])">Finalizar compra</button>
    </div>
  </div>
</ion-content>
