<ion-header id="headerPago">
  <ion-toolbar>
    <div class="header-content">
      <ion-img src="assets/icon/no-words-gb.png" id="logoPago"></ion-img>
      
      <span id="tituloPago"> <strong> Pague de la manera más conveniente 💵</strong></span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Confirmar Pago</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let item of cartItems">
          {{ item.nombre }} - ${{ item.precioUSD }} USD x {{ item.cantidad }}
        </ion-item>
        <ion-item>
          <ion-label>Total: </ion-label>
          <ion-label slot="end">${{ cartTotal }} USD</ion-label>
        </ion-item>
      </ion-list>
      <ion-button expand="block" (click)="onPay()">Confirmar Pago</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
